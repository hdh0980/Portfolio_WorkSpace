<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">2026년 08월 조사와 검증 경계</title>
  <desc id="desc">하계 피크 중간 점검을 조사 사실, 기술 해석, 다음 확인으로 구분한 도식</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7d90"/></marker></defs>
  <rect width="1200" height="510" fill="#ffffff"/>
  <text x="52" y="61" fill="#14283d" font-family="Arial, sans-serif" font-size="27" font-weight="700">2026년 08월 · 조사와 검증 경계</text>
  <text x="52" y="92" fill="#607386" font-family="Arial, sans-serif" font-size="18">하계 피크 중간 점검</text>
  <rect x="52" y="136" width="300" height="244" rx="12" fill="#edf4fb" stroke="#9dbbd9"/>
  <text x="80" y="181" fill="#1f4e79" font-family="Arial, sans-serif" font-size="23" font-weight="700">01  관찰 사실</text>
  <text x="80" y="222" fill="#263d52" font-family="Arial, sans-serif" font-size="18" font-weight="700">하계 수요</text>
  <text x="80" y="252" fill="#4e6377" font-family="Arial, sans-serif" font-size="17">월말 확정 전</text>
  <text x="80" y="306" fill="#53697f" font-family="Arial, sans-serif" font-size="16">수치·정책·발표 시점을</text>
  <text x="80" y="331" fill="#53697f" font-family="Arial, sans-serif" font-size="16">원문 단위 그대로 기록</text>
  <path d="M352 258 L442 258" fill="none" stroke="#6b7d90" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="442" y="136" width="318" height="244" rx="12" fill="#fff6e7" stroke="#e2ba68"/>
  <text x="470" y="181" fill="#805400" font-family="Arial, sans-serif" font-size="23" font-weight="700">02  기술적 해석</text>
  <text x="470" y="222" fill="#463614" font-family="Arial, sans-serif" font-size="18" font-weight="700">중간점검·최종실적 분리</text>
  <text x="470" y="268" fill="#6c5a36" font-family="Arial, sans-serif" font-size="16">UPS·ESS·OBC에 필요한</text>
  <text x="470" y="293" fill="#6c5a36" font-family="Arial, sans-serif" font-size="16">설계·운전·검증 질문만 도출</text>
  <path d="M760 258 L850 258" fill="none" stroke="#6b7d90" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="850" y="136" width="298" height="244" rx="12" fill="#eef8f2" stroke="#91c7a5"/>
  <text x="878" y="181" fill="#1f6a44" font-family="Arial, sans-serif" font-size="23" font-weight="700">03  다음 확인</text>
  <text x="878" y="226" fill="#315c45" font-family="Arial, sans-serif" font-size="17">월별 실적·계통 조건</text>
  <text x="878" y="255" fill="#315c45" font-family="Arial, sans-serif" font-size="17">제도·규격의 변경 시점</text>
