  <text x="878" y="313" fill="#315c45" font-family="Arial, sans-serif" font-size="17">확인할 항목만 남김</text>
  <rect x="52" y="420" width="1096" height="50" rx="8" fill="#14283d"/>
  <text x="78" y="452" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">판정 경계  ·  공개 산업자료는 제품 성능, 고객 적용, 사업성 또는 인증 결과의 근거가 아니다.</text>
