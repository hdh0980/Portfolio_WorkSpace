  <path d="M734 333 L816 237" fill="none" stroke="#6b7d90" stroke-width="3" marker-end="url(#arrow)"/><path d="M734 333 L816 333" fill="none" stroke="#6b7d90" stroke-width="3" marker-end="url(#arrow)"/><path d="M734 333 L816 429" fill="none" stroke="#6b7d90" stroke-width="3" marker-end="url(#arrow)"/>
