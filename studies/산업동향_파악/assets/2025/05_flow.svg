<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">2025년 05월 산업 신호와 전력변환 연결</title>
  <desc id="desc">배터리 공급망과 ESS 조달 제도을 UPS, ESS, OBC의 공개 검증 질문으로 연결한 도식</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7d90"/></marker></defs>
